function familyHome(){return '<div class="welcome"><span class="kicker">For the people waiting at home</span><h1>Every memory says: you matter.</h1><p>Save the moments you want to share. Photos, short videos, voice notes, and the little stories worth remembering.</p><div class="welcome-actions"><button class="btn light" data-go="add">'+ico('plus')+' Add a memory</button><button class="btn outline" style="border-color:#abb9b8;color:#fff" data-go="memories">See the timeline</button></div></div><div class="statrow"><div class="stat"><b>'+state.entries.length+'</b><small>Memories</small></div><div class="stat"><b>'+state.people.length+'</b><small>Contributors</small></div><div class="stat"><b>1</b><small>Shared story</small></div></div><div class="section-head"><h2>Recently added</h2><button class="btn outline small" data-go="memories">View all</button></div><div class="cards">'+state.entries.slice(-2).reverse().map(card).join('')+'</div><section class="panel gap16" style="margin-top:25px"><div class="spaced"><h2>Invite someone to contribute</h2>'+ico('users')+'</div><p class="muted">A sibling, parent, friend, or anyone with a memory to share. Invitations will require permission in the real app.</p><button class="btn secondary" data-go="people">Manage contributors '+ico('arrow')+'</button></section>'}
function kindIcon(m){return m.type==='video'?'video':m.type==='voice'?'mic':m.type==='story'?'book':'images'}
function card(m){return '<article class="memory-card"><div class="art '+(m.sensitive?'blue':m.type==='video'?'orange':m.type==='voice'?'dark':'gold')+'">'+ico(m.sensitive?'heart':kindIcon(m))+'</div><div class="memory-body"><span class="meta">'+safe(m.date)+' · '+safe(m.by)+'</span><h3>'+safe(m.sensitive?'A memory to open when ready':m.title)+'</h3><p>'+safe(m.sensitive?'You choose when to read this remembrance.':m.body.slice(0,100))+'</p><div class="spaced"><span class="tag">'+ico(m.sensitive?'lock':kindIcon(m))+' '+(m.sensitive?'Sensitive':safe(m.type))+'</span><button class="btn outline small" data-open-story="'+safe(m.id)+'">'+(m.sensitive?'Open gently':'Open memory')+'</button></div></div></article>'}
function listStories(family){const list=state.entries.filter(m=>state.filter==='all'||(state.filter==='sensitive'?m.sensitive:!m.sensitive)).slice().sort((a,b)=>b.date.localeCompare(a.date));return intro(family?'Family workspace':'Your people','Our stories',family?'Everything being saved for your loved one. Review entries and add more whenever you like.':'Moments and messages people saved for you. You decide what to open and when.')+'<div class="pillgroup" style="margin-bottom:20px">'+[['all','All memories'],['everyday','Everyday moments'],['sensitive','Remembrance']].map(x=>'<button class="pill '+(state.filter===x[0]?'active':'')+'" data-filter="'+x[0]+'">'+x[1]+'</button>').join('')+'</div>'+(family?'<div class="row" style="margin-bottom:22px"><button class="btn primary" data-go="add">'+ico('plus')+' Add memory</button></div>':'')+(list.length?'<div class="cards">'+list.map(card).join('')+'</div>':'<div class="empty">No memories in this category yet.</div>')+'<p class="hint" style="margin-top:16px">All names and events in this preview are fictional. Media is not uploaded or shared.</p>'}
function storyDetail(){const m=state.entries.find(x=>x.id===state.selected);if(!m)return listStories(state.mode==='family');const hidden=m.sensitive&&!state.revealed.includes(m.id)&&state.mode==='returning';return '<button class="back" data-go="'+(state.mode==='family'?'memories':'stories')+'">'+ico('back')+' Back to all memories</button><section class="panel gap24"><div class="row"><span class="tag">'+safe(m.type)+'</span>'+(m.sensitive?'<span class="tag">Remembrance</span>':'')+'</div><h1>'+safe(hidden?'A memory to open when you are ready':m.title)+'</h1><p class="muted">'+safe(m.date)+' · Shared by '+safe(m.by)+'</p>'+(hidden?'<div class="warning"><strong>This memory is about a difficult change or loss.</strong><p style="margin-top:7px">You can read it now or come back another time. Nothing is automatically shown.</p></div><div class="row"><button class="btn primary" data-reveal="'+safe(m.id)+'">I am ready to read it</button><button class="btn outline" data-go="stories">Maybe later</button></div>':'<div class="art '+(m.sensitive?'blue':'gold')+'" style="height:240px;border-radius:15px">'+ico(m.sensitive?'heart':kindIcon(m))+'</div><p style="font-size:1.07rem">'+safe(m.body)+'</p>'+(m.attachment?'<p class="notice">A file was selected in this demo: '+safe(m.attachment)+'. Its contents were not uploaded or stored.</p>':'')+(m.sensitive&&state.mode==='returning'?'<button class="btn outline" data-go="help">Find someone to talk to '+ico('arrow')+'</button>':'')+(state.mode==='family'&&!m.sample?'<button class="btn outline" data-delete="'+safe(m.id)+'">Remove this demo entry</button>':''))+'</section>'}
function addMemory(){return intro('Family workspace','Save a memory','Small moments matter, too. Record a video, choose a photo, share a voice note, or write a story.')+'<section class="panel"><form id="memoryForm" class="form"><div class="field"><label>1. What would you like to share?</label><div class="pillgroup">'+[['photo','Photo'],['video','Video'],['voice','Voice note'],['story','Written story']].map(x=>'<button type="button" class="pill '+(state.mediaType===x[0]?'active':'')+'" data-media="'+x[0]+'">'+x[1]+'</button>').join('')+'</div></div><div class="field" id="fileField"><label for="memoryFile">Choose a file or use your phone camera</label><input id="memoryFile" type="file" accept="image/*" aria-describedby="fileHelp"><span id="fileHelp" class="hint">Preview only: no file is uploaded or saved anywhere.</span><span id="fileName" class="hint"></span></div><div class="field"><label for="memoryTitle">2. Give this memory a title</label><input id="memoryTitle" name="title" maxlength="80" required placeholder="Example: The family reunion"></div><div class="twocol"><div class="field"><label for="memoryDate">When did it happen?</label><input id="memoryDate" type="date" name="date" max="'+today+'" required></div><div class="field"><label for="memoryBy">From</label><input id="memoryBy" name="by" maxlength="60" required value="Family member"></div></div><div class="field"><label for="memoryBody">3. Tell them about it</label><textarea id="memoryBody" name="body" maxlength="1200" required placeholder="What happened? Why did you want to save this moment?"></textarea></div><label class="check"><input name="sensitive" type="checkbox"><span><strong>This may be a difficult memory.</strong><span class="hint" style="display:block">Mark this for a separate, respectful reveal. Nothing sensitive should be shown unexpectedly.</span></span></label><button class="btn primary" type="submit">Save to demo timeline '+ico('arrow')+'</button><p class="hint">In the real product, this step will securely upload photos, videos, and audio for invited people only.</p></form></section>'}
function people(){return intro('Family workspace','People who care','The real app will use private invitations and permissions. For this prototype, you can try adding a name to the sample contributor list.')+'<div class="grid"><section class="panel gap16"><h2>Contributors</h2><div class="stack">'+state.people.map((p,i)=>'<div class="spaced" style="border-bottom:1px solid #e6e7df;padding:12px 0"><span>'+ico('users')+' '+safe(p)+'</span><span class="tag">'+(i===0?'Organizer':'Contributor')+'</span></div>').join('')+'</div></section><section class="panel gap16"><h2>Add a contributor</h2><form id="peopleForm" class="form"><div class="field"><label for="contribName">Person\'s name</label><input id="contribName" maxlength="55" required placeholder="Name"></div><button class="btn secondary" type="submit">Add demo contributor</button></form><p class="hint">No invitation is actually sent. Private accounts, consent and permissions will be designed in the production build.</p></section></div>'}
const history=[
{year:2014,title:'The world went mobile',cat:'Technology',body:'Smartphones became central to how people keep in touch, find directions, take photos, and use everyday services.'},
{year:2016,title:'New ways to pay',cat:'Everyday life',body:'Contactless payments and phone-based wallets spread. You can still choose cash or a card in many places.'},
{year:2020,title:'The COVID-19 pandemic',cat:'World events',body:'The pandemic changed daily life, work, travel, public health guidance, and how many services operate.'},
{year:2022,title:'AI reaches more people',cat:'Technology',body:'Conversational AI tools began reaching the public, changing how people search, write, and learn.'},
{year:2024,title:'More everyday tasks move online',cat:'Everyday life',body:'Appointments, employment applications, banking, and transportation often involve websites or mobile apps.'},
{year:2026,title:'Your world today',cat:'Getting oriented',body:'Start with the topics you care about. You can skip any subject and come back later.'}
];
function world(){const cards=history.filter(x=>x.year>=state.year);return intro('Your world','What did I miss?','A simple timeline of changes that happened while you were away. Choose a starting year and explore one topic at a time.')+'<section class="panel gap16" style="margin-bottom:22px"><div class="field"><label for="year">I want to catch up from the year</label><select id="year">'+Array.from({length:32},(_,i)=>1995+i).map(y=>'<option value="'+y+'" '+(state.year===y?'selected':'')+'>'+y+'</option>').join('')+'</select></div><p class="hint">You can change this any time. These are sample lessons, not a complete historical archive.</p></section><div class="stack">'+(cards.length?cards.map(x=>'<section class="panel gap16"><div class="spaced"><span class="tag">'+x.year+' · '+x.cat+'</span>'+ico('globe')+'</div><h2>'+safe(x.title)+'</h2><p class="muted">'+safe(x.body)+'</p></section>').join(''):'<div class="empty">No sample topics after your selected year yet. Try an earlier year.</div>')+'</div>'}
const lessons=[
{title:'How to use a QR code',text:['Open your phone camera.','Point it toward the square QR code.','Tap the link that appears only if you recognize and trust the source.']},
{title:'How to make a video call',text:['Open a video calling app you and the other person use.','Choose a contact you know.','Tap the video camera button. You can end the call any time.']},
{title:'How to apply for a job online',text:['Use the employer’s official website or a trusted job board.','Create a simple résumé with your recent skills and experience.','Fill out the application carefully. Save the confirmation if available.']},
{title:'How to use maps on your phone',text:['Open your phone’s Maps app.','Type the place you need to go.','Choose directions, then select walking, driving or transit.']}
];
function learn(){return intro('Everyday confidence','Show me how','Short lessons for things that may be new. No tests, scores or pressure. Learn at your own pace.')+'<div class="cards">'+lessons.map((x,i)=>'<section class="panel gap16"><span class="tag">Step-by-step lesson</span><h2>'+safe(x.title)+'</h2><p class="muted">'+x.text.length+' simple steps</p><button class="btn outline" data-lesson="'+i+'">Start lesson '+ico('arrow')+'</button></section>').join('')+'</div>'}
function lessonPage(){const l=lessons[state.lesson]||lessons[0],i=state.lessonStep;return '<button class="back" data-go="learn">'+ico('back')+' All lessons</button>'+intro('Step '+(i+1)+' of '+l.text.length,safe(l.title),'One step at a time. You can repeat any step.')+'<section class="panel gap24"><div class="step"><span class="stepnumber">'+(i+1)+'</span><h2>'+safe(l.text[i])+'</h2></div><div class="row">'+(i>0?'<button class="btn outline" data-action="previousStep">'+ico('back')+' Previous':'')+'<button class="btn primary" data-action="nextStep">'+(i===l.text.length-1?'Finish lesson':'Next step')+' '+ico('arrow')+'</button></div></section>'}
const topics=[['work','Job or training'],['housing','Housing'],['grief','Grief or loss'],['family','Family or relationships'],['documents','ID or paperwork'],['recovery','Recovery or health'],['legal','Legal or supervision'],['other','Something else']];
const resources={
work:[['CareerOneStop','Explore job search and career assistance for people impacted by the justice system.','https://www.careeronestop.org/JusticeImpacted/default.aspx'],['NC Local Reentry Councils','Ask a local council about employment and training support.','https://www.dac.nc.gov/divisions-and-sections/rehabilitation-and-reentry/local-reentry-councils']],
housing:[['211','Ask about housing, food, and other community resources. Dial 211 where available.','https://www.211.org/'],['NC Local Reentry Councils','Find the council serving your community.','https://www.dac.nc.gov/divisions-and-sections/rehabilitation-and-reentry/local-reentry-councils']],
grief:[['211','Ask for local grief support groups or counseling referrals.','https://www.211.org/'],['988 Lifeline','If you are in emotional crisis, you can call or text 988 in the United States.','https://988lifeline.org/']],
family:[['211','Find family counseling and other local community services.','https://www.211.org/'],['NC Local Reentry Councils','Ask about trusted community-based support.','https://www.dac.nc.gov/divisions-and-sections/rehabilitation-and-reentry/local-reentry-councils']],
documents:[['USA.gov','Guidance for government services and identity documents.','https://www.usa.gov/'],['NC Local Reentry Councils','Ask for local help obtaining ID and required paperwork.','https://www.dac.nc.gov/divisions-and-sections/rehabilitation-and-reentry/local-reentry-councils']],
recovery:[['SAMHSA National Helpline','Information about finding substance-use treatment and referral services.','https://www.samhsa.gov/find-help/national-helpline'],['988 Lifeline','Free crisis support by calling or texting 988 in the United States.','https://988lifeline.org/']],
legal:[['Legal Aid of North Carolina','Explore civil legal help and eligibility in North Carolina.','https://legalaidnc.org/'],['NC Department of Adult Correction','Find official NC correctional and reentry information. Individual supervision requirements come from your supervising authority.','https://www.dac.nc.gov/']],
other:[['211','Find local assistance for housing, bills, food, transportation, and more.','https://www.211.org/'],['NC Local Reentry Councils','Explore community reentry services.','https://www.dac.nc.gov/divisions-and-sections/rehabilitation-and-reentry/local-reentry-councils']]
};
function match(s){const v=s.toLowerCase();if(/suicid|hurt myself|kill myself|crisis|self.harm/.test(v))return 'grief';if(/job|work|employ|hire|resume|interview/.test(v))return 'work';if(/hous|rent|homeless|apartment|evict/.test(v))return 'housing';if(/dad|mom|death|died|grief|lost|funeral|bereave/.test(v))return 'grief';if(/sober|substance|drug|alcohol|recover|health|doctor/.test(v))return 'recovery';if(/parole|probation|court|law|legal|officer/.test(v))return 'legal';if(/birth certificate|social security|driver|license|identification|id card|paperwork/.test(v))return 'documents';if(/family|relationship|partner|child|argument|friend/.test(v))return 'family';return 'other'}
function help(){return intro('Real people. Real support.','I need help','You can choose a topic or describe what is happening. We will point you toward places you can contact.')+'<section class="panel gap24"><div class="field"><label>What would you like help with?</label><div class="pillgroup">'+topics.map(t=>'<button class="pill '+(state.helpTopic===t[0]?'active':'')+'" data-topic="'+t[0]+'">'+t[1]+'</button>').join('')+'</div></div><form id="helpForm" class="form"><div class="field"><label for="helpText">Or tell us in your own words</label><textarea id="helpText" maxlength="600" placeholder="Example: I need help finding work or somewhere to live.">'+safe(state.helpText)+'</textarea><p class="hint">This demo matches topics on your device only. Nothing you type is sent to a server or shared with family.</p></div><button type="submit" class="btn primary">Find places to start '+ico('arrow')+'</button></form><div class="notice">For immediate danger, call 911. For mental health crisis support in the U.S., call or text <a href="tel:988">988</a>.</div></section>'}
function helpResults(){const t=state.helpTopic||match(state.helpText),list=resources[t]||resources.other;return '<button class="back" data-go="help">'+ico('back')+' Change what I need</button>'+intro('Start here','Here are some places to try','These are general U.S. and North Carolina resources. They are not personalized referrals, and availability and eligibility must be confirmed with each organization.')+'<div class="stack">'+list.map(r=>'<section class="resource"><h2>'+safe(r[0])+'</h2><p>'+safe(r[1])+'</p><div class="row"><a class="btn secondary" href="'+safe(r[2])+'" target="_blank" rel="noopener noreferrer">Visit official site '+ico('arrow')+'</a>'+(r[0]==='211'?'<a class="btn outline" href="tel:211">'+ico('phone')+' Call 211</a>':'')+(r[0]==='988 Lifeline'?'<a class="btn outline" href="tel:988">'+ico('phone')+' Call 988</a>':'')+'</div></section>').join('')+'</div><section class="panel gap16" style="margin-top:20px"><h2>Want to talk to someone you trust?</h2><p class="muted">A family member, friend, mentor, or other trusted person may be able to help you take the first step.</p><p class="hint">Contact selection and sharing will be built later. This preview never notifies anyone.</p></section>'}
function pageHtml(){
if(state.page==='story')return storyDetail();
if(state.mode==='family'){if(state.page==='memories')return listStories(true);if(state.page==='add')return addMemory();if(state.page==='people')return people();return familyHome()}
if(state.page==='stories')return listStories(false);
if(state.page==='world')return world();
if(state.page==='learn')return learn();
if(state.page==='lesson')return lessonPage();
if(state.page==='help')return help();
if(state.page==='results')return helpResults();
return returningHome()
}
function render(){document.getElementById('app').innerHTML=shell();if(state.page==='add')updateFileField()}
function updateFileField(){const f=document.getElementById('memoryFile'),field=document.getElementById('fileField');if(!f||!field)return;if(state.mediaType==='story'){field.hidden=true;return}field.hidden=false;f.accept={photo:'image/*',video:'video/*',voice:'audio/*'}[state.mediaType];const label=field.querySelector('label');label.textContent=state.mediaType==='video'?'Choose or record a video':state.mediaType==='voice'?'Choose or record audio':'Choose or take a photo';f.value='';state.file='';const labelName=document.getElementById('fileName');if(labelName)labelName.textContent=''}
document.addEventListener('click',function(e){
const m=e.target.closest('[data-mode]');if(m){setMode(m.dataset.mode);return}
const g=e.target.closest('[data-go]');if(g){e.preventDefault();go(g.dataset.go);return}
const f=e.target.closest('[data-filter]');if(f){state.filter=f.dataset.filter;render();return}
const v=e.target.closest('[data-open-story]');if(v){state.selected=v.dataset.openStory;go('story');return}
const rv=e.target.closest('[data-reveal]');if(rv){state.revealed.push(rv.dataset.reveal);render();return}
const md=e.target.closest('[data-media]');if(md){state.mediaType=md.dataset.media;document.querySelectorAll('[data-media]').forEach(x=>x.classList.toggle('active',x===md));updateFileField();return}
const tm=e.target.closest('[data-topic]');if(tm){state.helpTopic=tm.dataset.topic;document.querySelectorAll('[data-topic]').forEach(x=>x.classList.toggle('active',x===tm));return}
const ls=e.target.closest('[data-lesson]');if(ls){state.lesson=Number(ls.dataset.lesson);state.lessonStep=0;go('lesson');return}
const d=e.target.closest('[data-delete]');if(d){if(confirm('Remove this sample entry from the demo timeline?')){state.entries=state.entries.filter(x=>x.id!==d.dataset.delete);persist();go('memories');toast('Demo memory removed.')}return}
const a=e.target.closest('[data-action]');if(a){if(a.dataset.action==='reset'){if(confirm('Reset sample memories and contributor names in this browser?')){localStorage.removeItem(K);location.reload()}return}
if(a.dataset.action==='nextStep'){if(state.lessonStep>=lessons[state.lesson].text.length-1){go('learn');toast('Lesson complete. You can revisit it anytime.')}else{state.lessonStep++;render()}return}
if(a.dataset.action==='previousStep'){state.lessonStep=Math.max(0,state.lessonStep-1);render();return}}
});
document.addEventListener('change',function(e){
if(e.target.id==='memoryFile'){state.file=e.target.files?.[0]?.name||'';document.getElementById('fileName').textContent=state.file?'Selected: '+state.file:''}
if(e.target.id==='year'){state.year=Number(e.target.value);persist();render()}
});
document.addEventListener('submit',function(e){
if(e.target.id==='memoryForm'){e.preventDefault();const f=new FormData(e.target);const item={id:'d-'+Date.now(),title:String(f.get('title')||'').trim(),date:String(f.get('date')||''),type:state.mediaType,by:String(f.get('by')||'').trim(),body:String(f.get('body')||'').trim(),sensitive:f.get('sensitive')==='on',attachment:state.file,sample:false};if(!item.title||!item.date||!item.body){toast('Please complete the title, date and story.');return}state.entries.push(item);state.file='';state.filter='all';persist();go('memories');toast('Memory added to this browser demo. No media was uploaded.');return}
if(e.target.id==='peopleForm'){e.preventDefault();const v=String(new FormData(e.target).get('unused')||e.target.querySelector('input').value).trim();if(v&&!state.people.includes(v)){state.people.push(v);persist();render();toast('Demo contributor added. No invitation was sent.')}return}
if(e.target.id==='helpForm'){e.preventDefault();state.helpText=document.getElementById('helpText').value.trim();state.helpTopic=state.helpTopic||match(state.helpText);go('results');return}
});
render();
})();
</script>
</body></html>
